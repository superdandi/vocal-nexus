<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode // Voice Nexus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f; color: #c0c0e0;
  font-family: 'Rajdhani', sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px; z-index: 0; animation: gridPulse 4s ease-in-out infinite;
}
@keyframes gridPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
body::after {
  content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px);
  pointer-events: none; z-index: 10;
}
.container { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 720px; width: 100%; }
.holo-ring { position: relative; width: 240px; height: 240px; margin: 0 auto 1.5rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.holo-ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; background: conic-gradient(from 0deg, transparent, #0ff, transparent, #f0f, transparent, #0ff, transparent) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: rotateRing 6s linear infinite; }
.holo-ring::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; border: 1px solid rgba(0, 255, 255, 0.15); box-shadow: 0 0 20px rgba(0, 255, 255, 0.1), inset 0 0 20px rgba(0, 255, 255, 0.05); animation: pulseRing 3s ease-in-out infinite; }
@keyframes rotateRing { to { transform: rotate(360deg); } }
@keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.05); opacity: 1; } }
.holo-inner { position: relative; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(0, 255, 255, 0.08) 0%, transparent 70%); animation: holoBreathe 4s ease-in-out infinite; display: flex; align-items: center; justify-content: center; }
@keyframes holoBreathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.08); opacity: 1; } }
.viz-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(0, 255, 255, 0.2); animation: vizExpand 2.5s ease-out infinite; }
.viz-ring:nth-child(1) { inset: -10px; animation-delay: 0s; }
.viz-ring:nth-child(2) { inset: -20px; animation-delay: 0.4s; }
.viz-ring:nth-child(3) { inset: -30px; animation-delay: 0.8s; }
.viz-ring:nth-child(4) { inset: -40px; animation-delay: 1.2s; }
@keyframes vizExpand { 0% { transform: scale(0.8); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0; } }
@keyframes vizListen { 0% { transform: scale(1.1); opacity: 0.2; border-width: 2px; } 50% { transform: scale(0.95); opacity: 0.8; border-width: 1px; } 100% { transform: scale(1.1); opacity: 0.2; border-width: 2px; } }
.holo-inner.active .viz-ring { border-color: rgba(255, 0, 255, 0.4); animation: vizExpand 1.8s ease-out infinite; }
.holo-inner.listening .viz-ring { border-color: rgba(0, 255, 255, 0.6); animation: vizListen 2s ease-in-out infinite; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }
.holo-icon { font-size: 2.8rem; filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.6)); transition: all 0.3s; }
.holo-inner.active .holo-icon { filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.8)); }
.holo-inner.listening .holo-icon { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 1)); }
.title { font-family: 'Orbitron', monospace; font-size: 1.6rem; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 0.3rem; }
.title-line { display: block; font-family: 'Rajdhani', sans-serif; font-size: 0.65rem; font-weight: 300; letter-spacing: 8px; color: rgba(0, 255, 255, 0.5); margin-top: -0.3rem; }
.status-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0.8rem 0 1rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #333; transition: all 0.4s; }
.dot.connected { background: #0ff; box-shadow: 0 0 12px rgba(0, 255, 255, 0.6); animation: dotPulse 1.5s ease-in-out infinite; }
@keyframes dotPulse { 0%, 100% { box-shadow: 0 0 8px rgba(0, 255, 255, 0.4); } 50% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.8); } }
#status { font-family: 'Orbitron', monospace; font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: #666; transition: all 0.4s; }
#status.connected { color: #0ff; }
.client-bar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 6px 0; min-height: 20px; }
.client-badge { font-family: 'Rajdhani', sans-serif; font-size: 0.65rem; letter-spacing: 1px; padding: 2px 8px; border-radius: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); transition: all 0.2s; background: rgba(0,0,0,0.2); user-select: none; }
.client-badge:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); }
.client-badge.voice-on { border-color: #0ff; color: #0ff; box-shadow: 0 0 8px rgba(0,255,255,0.3); background: rgba(0,255,255,0.05); }
.client-badge.voice-on::before { content: '◆ '; }
.client-badge.voice-off::before { content: '◇ '; }
.client-badge.self { border-style: dashed; opacity: 0.6; }
.client-badge.self.voice-on { opacity: 1; }
.client-badge.self.voice-off { opacity: 0.8; }
.speech-container { min-height: 60px; display: flex; align-items: center; justify-content: center; margin: 0.5rem 0; }
#speech { font-family: 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 500; color: rgba(255, 255, 255, 0.85); text-shadow: 0 0 10px rgba(0, 255, 255, 0.3); transition: all 0.5s; line-height: 1.4; padding: 0.3rem 0.8rem; }
#speech.idle { color: rgba(255, 255, 255, 0.15); font-size: 0.9rem; }
.viz-bars { display: flex; align-items: flex-end; gap: 2px; justify-content: center; height: 24px; margin: 0.5rem 0; }
.viz-bar { width: 3px; background: linear-gradient(to top, #0ff, #f0f); border-radius: 2px; opacity: 0; transition: opacity 0.3s; }
.viz-bar.active { opacity: 0.6; animation: barAnim 0.5s ease-in-out infinite alternate; }
.viz-bar.listening { opacity: 0.4; background: linear-gradient(to top, #0ff, #0ff); animation: barListen 0.8s ease-in-out infinite alternate; }
@keyframes barAnim { 0% { height: 3px; } 100% { height: 24px; } }
@keyframes barListen { 0% { height: 4px; } 50% { height: 14px; } 100% { height: 4px; } }
.footer { margin-top: 1.5rem; font-size: 0.6rem; font-family: 'Orbitron', monospace; letter-spacing: 4px; color: rgba(255, 255, 255, 0.06); text-transform: uppercase; }
.particles { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.particle { position: absolute; width: 2px; height: 2px; background: #0ff; border-radius: 50%; animation: particleFloat linear infinite; opacity: 0; }
@keyframes particleFloat { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-10vh) scale(1); opacity: 0; } }
.notif-log { max-height: 180px; overflow-y: auto; text-align: left; margin: 0.8rem 0; padding: 0.6rem; border-radius: 8px; background: rgba(0, 255, 255, 0.02); border: 1px solid rgba(0, 255, 255, 0.06); font-size: 0.7rem; scrollbar-width: thin; scrollbar-color: rgba(0,255,255,0.2) transparent; }
.notif-log:empty { display: none; }
.notif-item { padding: 0.2rem 0.4rem; margin: 0.15rem 0; border-radius: 4px; animation: notifFade 0.3s ease-out; display: flex; gap: 0.5rem; }
.notif-item .notif-time { color: rgba(0,255,255,0.3); font-family: 'Orbitron', monospace; font-size: 0.55rem; flex-shrink: 0; }
.notif-item .notif-text { color: rgba(255,255,255,0.6); }
.notif-item.voice { border-left: 2px solid #0ff; }
.notif-item.text-only { border-left: 2px solid rgba(255,255,255,0.1); }
@keyframes notifFade { 0% { opacity: 0; transform: translateY(-5px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes msgFade { 0% { opacity: 0; transform: translateY(5px); } 100% { opacity: 1; transform: translateY(0); } }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
.modal-box { background: #0d0d14; border: 1px solid rgba(0,255,255,0.2); border-radius: 12px; padding: 2.5rem; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 0 40px rgba(0,255,255,0.1), inset 0 0 30px rgba(0,255,255,0.02); }
.modal-box h2 { font-family: 'Orbitron', monospace; font-size: 1.1rem; letter-spacing: 4px; color: #0ff; margin-bottom: 0.5rem; }
.modal-box p { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-bottom: 1.5rem; line-height: 1.5; }
.modal-box input { width: 100%; padding: 0.7rem 1rem; background: rgba(0,255,255,0.04); border: 1px solid rgba(0,255,255,0.2); border-radius: 6px; color: #0ff; font-family: 'Orbitron', monospace; font-size: 0.8rem; letter-spacing: 2px; text-align: center; outline: none; transition: all 0.3s; }
.modal-box input:focus { border-color: #0ff; box-shadow: 0 0 15px rgba(0,255,255,0.15); }
.modal-box input::placeholder { color: rgba(0,255,255,0.15); }
.modal-btn { font-family: 'Orbitron', monospace; font-size: 0.7rem; letter-spacing: 3px; background: transparent; border: 1px solid rgba(0,255,255,0.3); color: #0ff; padding: 0.6rem 2rem; cursor: pointer; border-radius: 4px; transition: all 0.3s; text-transform: uppercase; margin-top: 1rem; }
.modal-btn:hover { border-color: #0ff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); background: rgba(0,255,255,0.05); }
.modal-hint { font-size: 0.6rem; color: rgba(255,255,255,0.2); margin-top: 0.8rem; }
@media (max-width: 480px) { .holo-ring { width: 180px; height: 180px; } .holo-inner { width: 120px; height: 120px; } .title { font-size: 1.1rem; } #speech { font-size: 1rem; } }
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="container">
  <div class="holo-ring">
    <div class="holo-inner" id="holoInner">
      <span class="viz-ring"></span><span class="viz-ring"></span>
      <span class="viz-ring"></span><span class="viz-ring"></span>
      <span class="holo-icon" id="holoIcon">◈</span>
    </div>
  </div>
  <div class="title">OPencode<span class="title-line">⋮ voice nexus ⋮</span></div>
  <div class="status-bar"><span class="dot" id="dot"></span><span id="status">CONECTANDO...</span></div>
  <div class="client-bar" id="clientBar"></div>
  <div class="speech-container"><div id="speech" class="idle">Esperando señal...</div></div>
  <div class="viz-bars" id="vizBars"></div>
  <div class="notif-log" id="notifLog"></div>
  <div class="footer">▸ sistema de voz neural ▸</div>
</div>
<audio id="audio" autoplay style="display:none"></audio>
<div class="modal-overlay" id="nameModal" style="display:none">
  <div class="modal-box">
    <h2 id="modalTitle">VOICE NEXUS</h2>
    <p id="modalDesc">Asigna un nombre a este terminal para que los demás puedan identificarlo en la red.</p>
    <input type="text" id="nameInput" placeholder="nombre-del-equipo" maxlength="30" autocomplete="off" spellcheck="false">
    <button class="modal-btn" id="nameBtn">CONECTAR</button>
    <div class="modal-hint" id="modalHint">Enter para conectar &middot; Doble click en tu badge para renombrar</div>
  </div>
</div>
<script>
const audio = document.getElementById('audio');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const holoInner = document.getElementById('holoInner');
const holoIcon = document.getElementById('holoIcon');
const speech = document.getElementById('speech');
const notifLog = document.getElementById('notifLog');
const nameModal = document.getElementById('nameModal');
const nameInput = document.getElementById('nameInput');
const nameBtn = document.getElementById('nameBtn');
const clientBar = document.getElementById('clientBar');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalHint = document.getElementById('modalHint');

let myName = localStorage.getItem('nexus_name');
let clientList = [];
let voiceTargets = [];
let speechUnlocked = false;
let speaking = false;
let listening = false;
let renameOldName = null;

function showRenameModal(oldName) {
  renameOldName = oldName;
  modalTitle.textContent = 'RENOMBRAR TERMINAL';
  modalDesc.textContent = 'Ingresa el nuevo nombre para este terminal.';
  nameInput.value = oldName;
  nameBtn.textContent = 'RENOMBRAR';
  modalHint.textContent = 'Enter para confirmar';
  nameModal.style.display = 'flex';
  setTimeout(() => nameInput.focus(), 100);
}

function showModal() {
  renameOldName = null;
  modalTitle.textContent = 'VOICE NEXUS';
  modalDesc.textContent = 'Asigna un nombre a este terminal para que los demás puedan identificarlo en la red.';
  nameInput.value = myName || '';
  nameBtn.textContent = 'CONECTAR';
  modalHint.textContent = 'Enter para conectar';
  nameModal.style.display = 'flex';
  setTimeout(() => nameInput.focus(), 100);
}

function hideModal() {
  nameModal.style.display = 'none';
  renameOldName = null;
}

function saveName(name) {
  const newName = name.trim().toLowerCase().replace(/[^a-z0-9\-_]/g, '-');
  if (!newName) return;
  const oldName = renameOldName;
  myName = newName;
  localStorage.setItem('nexus_name', myName);
  hideModal();
  unlockSpeech();
  if (oldName && oldName !== myName) {
    fetch('/api/voice-target', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: oldName, enabled: false })
    });
    fetch('/api/voice-target', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: myName, enabled: true })
    });
    fetch('/api/client/' + encodeURIComponent(oldName), { method: 'DELETE' });
    if (es) es.close();
  }
  connectSSE();
  setTimeout(() => playBeep(), 500);
}

if (!myName) {
  showModal();
}

nameBtn.addEventListener('click', () => {
  const val = nameInput.value.trim();
  if (val) saveName(val);
});
nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = nameInput.value.trim();
    if (val) saveName(val);
  }
});

let audioCtx = null;

function unlockSpeech() {
  if (speechUnlocked) return;
  speechUnlocked = true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().then(() => console.log('AudioContext resumed')).catch(() => {});
    }
  } catch (e) { console.log('AudioContext error:', e); }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance('.');
    u.volume = 0.01;
    u.lang = 'es-MX';
    window.speechSynthesis.speak(u);
    console.log('speechSynthesis unlock attempted');
  } catch (e) { console.log('speechSynthesis unlock error:', e); }
}

document.addEventListener('click', unlockSpeech, { once: true });
document.addEventListener('touchstart', unlockSpeech, { once: true });
document.addEventListener('keydown', unlockSpeech, { once: true });

function renderClients(clients, targets) {
  clientBar.innerHTML = '';
  const sorted = [...clients].sort((a, b) => {
    if (a.name === myName) return -1;
    if (b.name === myName) return 1;
    return a.name.localeCompare(b.name);
  });
  sorted.forEach(c => {
    const badge = document.createElement('span');
    const isSelf = c.name === myName;
    const isVoiceOn = targets.includes(c.name);
    badge.className = 'client-badge ' + (isVoiceOn ? 'voice-on' : 'voice-off') + (isSelf ? ' self' : '');
    badge.textContent = c.name;
    if (!isSelf) {
      badge.title = isVoiceOn ? `Voz ACTIVADA para ${c.name} — click para desactivar` : `Voz desactivada para ${c.name} — click para activar`;
      badge.addEventListener('click', () => {
        fetch('/api/voice-target', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: c.name, enabled: !isVoiceOn })
        });
      });
    } else {
      badge.title = 'Doble click para renombrar este terminal';
      badge.addEventListener('dblclick', () => {
        showRenameModal(myName);
      });
    }
    clientBar.appendChild(badge);
  });
}

for (let i = 0; i < 20; i++) {
  const bar = document.createElement('div');
  bar.className = 'viz-bar';
  bar.style.animationDelay = `${i * 0.04}s`;
  document.getElementById('vizBars').appendChild(bar);
}
const bars = document.getElementById('vizBars').querySelectorAll('.viz-bar');

const particles = document.getElementById('particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = `${Math.random() * 100}%`;
  p.style.width = `${1 + Math.random() * 2}px`;
  p.style.height = p.style.width;
  p.style.animationDuration = `${10 + Math.random() * 20}s`;
  p.style.animationDelay = `${Math.random() * 20}s`;
  p.style.background = ['#0ff', '#f0f', '#ff0', '#fff'][Math.floor(Math.random() * 4)];
  particles.appendChild(p);
}

function setSpeaking(active) {
  speaking = active;
  if (active) listening = false;
  holoInner.classList.toggle('active', active);
  if (active) holoInner.classList.remove('listening');
  speech.classList.toggle('idle', !active && !listening);
  bars.forEach(b => { b.classList.toggle('active', active); if (active) b.classList.remove('listening'); });
  holoIcon.textContent = active ? '◉' : listening ? '◎' : '◈';
}

function setListening(active) {
  listening = active;
  if (active) speaking = false;
  holoInner.classList.toggle('listening', active);
  if (active) holoInner.classList.remove('active');
  speech.classList.toggle('idle', !active && !speaking);
  bars.forEach(b => { b.classList.toggle('listening', active); if (active) b.classList.remove('active'); });
  holoIcon.textContent = active ? '◎' : speaking ? '◉' : '◈';
}

function setConnected(connected) {
  dot.className = 'dot ' + (connected ? 'connected' : '');
  statusEl.textContent = connected ? 'CONECTADO' : 'DESCONECTADO';
  statusEl.className = connected ? 'connected' : '';
  if (!connected) { setSpeaking(false); setListening(false); }
}

function speakText(text) {
  if (!text) return;
  speech.textContent = text;
  setSpeaking(true);

  if (!speechUnlocked) unlockSpeech();

  playBeep();

  tryTTS(text);
}

function tryTTS(text) {
  if (hasGoodVoices()) {
    console.log('Trying speechSynthesis first');
    let done = false;
    const timeout = setTimeout(() => {
      if (!done) { done = true; console.log('speechSynthesis timeout, fallback to server'); serverTTS(text); }
    }, 3000);
    const finish = () => { if (!done) { done = true; clearTimeout(timeout); setSpeaking(false); } };
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'es-MX';
      utter.volume = 1.0;
      utter.onend = finish;
      utter.onerror = () => { console.log('speechSynthesis error, fallback to server'); if (!done) { done = true; clearTimeout(timeout); serverTTS(text); } };
      window.speechSynthesis.speak(utter);
    } catch (e) { if (!done) { done = true; clearTimeout(timeout); serverTTS(text); } }
  } else {
    serverTTS(text);
  }
}

function serverTTS(text) {
  console.log('Using server TTS');
  const a = new Audio('/api/tts?text=' + encodeURIComponent(text));
  a.volume = 1.0;
  let done = false;
  const finish = () => { if (!done) { done = true; setSpeaking(false); } };
  a.onended = finish;
  a.onerror = () => { console.log('Server TTS error'); finish(); };
  a.play().catch(() => { console.log('Server TTS play blocked'); finish(); });
}

function hasGoodVoices() {
  if (!('speechSynthesis' in window)) return false;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return false;
  const hasNative = voices.some(v => v.localService === true && !v.name.includes('Google'));
  const hasEs = voices.some(v => v.lang.startsWith('es'));
  return hasNative && hasEs;
}

function playBeep() {
  try {
    const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
    if (!audioCtx) audioCtx = ctx;
  } catch (e) {
    console.log('playBeep AudioContext failed, trying Audio element');
    try {

function addNotif(text, voice) {
  const item = document.createElement('div');
  item.className = 'notif-item ' + (voice ? 'voice' : 'text-only');
  const now = new Date();
  const ts = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  item.innerHTML = `<span class="notif-time">${ts}</span><span class="notif-text">${text}</span>`;
  notifLog.prepend(item);
  while (notifLog.children.length > 50) {
    notifLog.removeChild(notifLog.lastChild);
  }
}

let es = null;
let reconnectDelay = 1000;
let reconnectTimer = null;

function connectSSE() {
  if (es) es.close();
  clearTimeout(reconnectTimer);
  es = new EventSource('/events?name=' + encodeURIComponent(myName));
  es.onopen = () => { setConnected(true); reconnectDelay = 1000; };
  es.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'connected') {
        clientList = d.clients || [];
        voiceTargets = d.voiceTargets || [];
        renderClients(clientList, voiceTargets);
      } else if (d.type === 'clients') {
        clientList = d.clients || [];
        voiceTargets = d.voiceTargets || [];
        renderClients(clientList, voiceTargets);
      } else if (d.type === 'notification') {
        const amIVoiceTarget = voiceTargets.includes(myName);
        addNotif(d.text, amIVoiceTarget);
      } else if (d.type === 'speak') {
        speakText(d.text);
      } else if (d.type === 'show_text') {
        speech.textContent = d.text;
      } else if (d.type === 'listening') {
        setListening(d.active);
        if (d.active) speech.textContent = 'Escuchando...';
      } else if (d.type === 'start_mic') {
        setListening(true);
        speech.textContent = 'Grabando...';
        startMicCapture(d.timeout || 10);
      }
    } catch(err) {}
  };
  es.onerror = () => {
    setConnected(false);
    es.close();
    reconnectTimer = setTimeout(() => {
      reconnectDelay = Math.min(reconnectDelay * 2, 30000);
      connectSSE();
    }, reconnectDelay);
  };
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && myName && (!es || es.readyState === EventSource.CLOSED)) {
    reconnectDelay = 1000;
    connectSSE();
  }
});

if (myName) {
  connectSSE();
}

audio.onended = () => setSpeaking(false);
audio.onerror = () => { setSpeaking(false); speech.textContent = '(Error audio)'; };

const keepAliveAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
keepAliveAudio.loop = true;
keepAliveAudio.volume = 0.001;

document.addEventListener('click', () => {
  keepAliveAudio.play().catch(() => {});
}, { once: true });

setInterval(() => {
  if (!myName) return;
  fetch('/api/health').catch(() => {});
  if (es && es.readyState === EventSource.CLOSED) {
    console.log('SSE dead, reconnecting...');
    reconnectDelay = 1000;
    connectSSE();
  }
}, 6000);

function pcmToWav(pcmData, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = pcmData.byteLength;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);
  const write = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
  write(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  write(8, 'WAVE');
  write(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  write(36, 'data');
  view.setUint32(40, dataSize, true);
  new Uint8Array(buffer, 44).set(new Uint8Array(pcmData));
  return buffer;
}

let micRecorder = null;
let micStream = null;
let micChunks = [];
let micTimeoutId = null;

function startMicCapture(timeout) {
  if (micRecorder) return;
  if (typeof MediaRecorder === 'undefined' || !navigator.mediaDevices) return;
  speech.textContent = 'Grabando...';
  setListening(true);
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      micStream = stream;
      micChunks = [];
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
      let mimeType = '';
      for (const t of types) { if (MediaRecorder.isTypeSupported(t)) { mimeType = t; break; } }
      micRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
      micRecorder.ondataavailable = (e) => { if (e.data.size > 0) micChunks.push(e.data); };
      micRecorder.onstop = () => {
        setListening(false);
        micStream.getTracks().forEach(t => t.stop());
        micRecorder = null;
        micStream = null;
      };
      micRecorder.start(100);
      clearTimeout(micTimeoutId);
      micTimeoutId = setTimeout(() => { if (micRecorder && micRecorder.state === 'recording') micRecorder.stop(); }, timeout * 1000);
    })
    .catch(() => setListening(false));
}
